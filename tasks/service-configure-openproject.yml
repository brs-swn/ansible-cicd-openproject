---
# Build EPEL Stub RPM
- name: Create RPM Build Paths
  ansible.builtin.command: /usr/bin/rpmdev-setuptree

- name: Copy RPM SPEC File
  copy:
    src: "files/epel-release-stub.spec"
    dest: "/root/rpmbuild/SPECS/"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Build EPEL Stub
  ansible.builtin.command: rpmbuild -bb epel-release-stub.spec
  args:
    chdir: "/root/rpmbuild/SPECS/"
    creates: "/root/rpmbuild/RPMS/noarch/epel-release-stub-1.0-1.noarch.rpm"

# Install OpenProject RPM
- name: Install DNF Packages
  ansible.builtin.dnf:
    name:
      - "/root/rpmbuild/RPMS/noarch/epel-release-stub-1.0-1.noarch.rpm"
      - openproject
    disable_gpg_check: true
    state: latest

# Configure OpenProject
- name: OpenProject Template Configs
  ansible.builtin.template:
    src: "templates/openproject-installer.dat.j2"
    dest: "/etc/openproject/installer.dat"
    owner: "openproject"
    group: "openproject"
    mode: "0640"

